<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple IPTV Player</title>
<style>
  :root { color-scheme: dark; --bg:#111318; --panel:#1c2028; --line:#343a46; --accent:#f4d938; --text:#f5f6f8; --muted:#aab1bd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Arial, sans-serif; }
  main { width:min(760px,100%); margin:0 auto; padding:18px 14px 28px; }
  h1 { font-size:23px; margin:5px 0 18px; text-align:center; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .tab, button { border:0; border-radius:9px; padding:12px; font-size:15px; cursor:pointer; }
  .tab { background:#292e38; color:var(--text); border:1px solid var(--line); }
  .tab.active, .primary { background:var(--accent); color:#171717; font-weight:700; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px; margin-bottom:14px; }
  label { display:block; font-size:14px; margin:12px 0 6px; color:#e1e4e9; }
  input { width:100%; padding:12px; border-radius:8px; border:1px solid #454c59; background:#101319; color:white; font-size:15px; }
  button { width:100%; margin-top:13px; }
  .secondary { background:#303641; color:white; }
  video { width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; display:block; }
  .status { color:var(--muted); font-size:13px; margin:10px 2px 0; overflow-wrap:anywhere; }
  .channels { display:flex; flex-direction:column; gap:7px; margin-top:12px; max-height:320px; overflow:auto; }
  .channel { text-align:left; background:#292e38; color:white; border:1px solid #414855; margin:0; }
  .channel:focus, .channel:hover { border-color:var(--accent); }
  .hidden { display:none !important; }
  .hint { color:var(--muted); font-size:12px; line-height:1.5; margin:10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Simple IPTV Player</h1>
  <div class="tabs">
    <button class="tab active" id="m3uTab" type="button">M3U Link</button>
    <button class="tab" id="xtreamTab" type="button">Xtream Codes</button>
  </div>

  <section class="panel" id="m3uPanel">
    <label for="m3uUrl">M3U Playlist Link</label>
    <input id="m3uUrl" type="url" placeholder="https://example.com/playlist.m3u" autocomplete="url">
    <button class="primary" id="loadM3u" type="button">Load Playlist</button>
    <p class="hint">M3U ফাইলে থাকা চ্যানেলগুলো নিচে দেখাবে। কোনো লিংক সরাসরি ভিডিও হলে সেটিও চালানোর চেষ্টা করবে।</p>
  </section>

  <section class="panel hidden" id="xtreamPanel">
    <label for="server">Server Address</label>
    <input id="server" type="url" placeholder="https://server.example.com" autocomplete="url">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="loadXtream" type="button">Connect</button>
    <p class="hint">আপনার সার্ভারে Xtream Codes API চালু থাকতে হবে। পরিচিত/বিশ্বস্ত সার্ভারের তথ্যই ব্যবহার করুন।</p>
  </section>

  <section class="panel">
    <video id="video" controls playsinline preload="metadata"></video>
    <div class="status" id="status" role="status">M3U লিংক দিন অথবা Xtream Codes নির্বাচন করুন।</div>
    <div class="channels" id="channels"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const m3uTab = $('m3uTab'), xtreamTab = $('xtreamTab');
  const m3uPanel = $('m3uPanel'), xtreamPanel = $('xtreamPanel');
  const video = $('video'), status = $('status'), channelsBox = $('channels');
  let hls = null, currentItems = [];

  function message(text) { status.textContent = text; }
  function cleanServer(value) { return value.trim().replace(/\/+$/, ''); }

  function showTab(which) {
    const m3u = which === 'm3u';
    m3uPanel.classList.toggle('hidden', !m3u);
    xtreamPanel.classList.toggle('hidden', m3u);
    m3uTab.classList.toggle('active', m3u);
    xtreamTab.classList.toggle('active', !m3u);
    message(m3u ? 'M3U লিংক দিন অথবা প্লেলিস্ট লোড করুন।' : 'Xtream Codes সার্ভারের তথ্য দিন।');
  }
  m3uTab.addEventListener('click', () => showTab('m3u'));
  xtreamTab.addEventListener('click', () => showTab('xtream'));

  function stopCurrent() {
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
  }

  function playItem(item) {
    if (!item || !item.url) return;
    stopCurrent();
    message('চালু করার চেষ্টা হচ্ছে: ' + item.name);
    const url = item.url.trim();
    if (window.Hls && Hls.isSupported() && (/\.m3u8($|\?)/i.test(url) || url.includes('.m3u8'))) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => message('Play চাপুন। অটো-প্লে ব্রাউজার ব্লক করতে পারে।')));
      hls.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) message('ভিডিও চালানো যায়নি। লিংক, নেটওয়ার্ক বা সার্ভার পরীক্ষা করুন।'); });
    } else {
      video.src = url;
      video.play().catch(() => message('ভিডিও চালাতে Play চাপুন। ফরম্যাট বা সার্ভার ব্রাউজারে সমর্থিত নাও হতে পারে।'));
    }
  }

  function renderItems(items) {
    currentItems = items;
    channelsBox.replaceChildren();
    if (!items.length) {
      message('কোনো চ্যানেল পাওয়া যায়নি। লিংক বা সার্ভারের তথ্য পরীক্ষা করুন।');
      return;
    }
    const frag = document.createDocumentFragment();
    items.forEach((item, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'channel';
      button.textContent = (index + 1) + '. ' + item.name;
      button.addEventListener('click', () => playItem(item));
      frag.appendChild(button);
    });
    channelsBox.appendChild(frag);
    message(items.length + 'টি চ্যানেল পাওয়া গেছে। চালাতে চ্যানেলের নাম চাপুন।');
  }

  function parseM3U(text) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
    const items = [];
    let name = 'Channel';
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith('#EXTINF')) {
        const comma = line.lastIndexOf(',');
        name = comma >= 0 ? line.slice(comma + 1).trim() : 'Channel';
        const tvg = line.match(/tvg-name="([^"]+)"/i);
        if ((!name || name === 'Channel') && tvg) name = tvg[1];
      } else if (!line.startsWith('#')) {
        if (/^https?:\/\//i.test(line)) items.push({ name: name || 'Channel', url: line });
        name = 'Channel';
      }
    }
    return items;
  }

  $('loadM3u').addEventListener('click', async () => {
    const url = $('m3uUrl').value.trim();
    if (!url) { message('আগে M3U Playlist Link দিন।'); return; }
    try {
      message('প্লেলিস্ট লোড হচ্ছে…');
      const response = await fetch(url);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const text = await response.text();
      if (!text.trim()) throw new Error('খালি প্লেলিস্ট');
      renderItems(parseM3U(text));
    } catch (e) {
      message('প্লেলিস্ট লোড হয়নি। লিংক ভুল হতে পারে অথবা CORS অনুমতি নেই। (' + e.message + ')');
    }
  });

  $('loadXtream').addEventListener('click', async () => {
    const server = cleanServer($('server').value);
    const username = $('username').value.trim();
    const password = $('password').value;
    if (!server || !username || !password) { message('Server Address, Username ও Password—তিনটিই দিন।'); return; }
    try {
      message('সার্ভারে সংযোগ হচ্ছে…');
      const api = server + '/player_api.php?username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password);
      const response = await fetch(api);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const info = await response.json();
      if (!info || !info.user_info || info.user_info.auth === 0) throw new Error('লগইন তথ্য গ্রহণ করা হয়নি');
      const liveResponse = await fetch(api + '&action=get_live_streams');
      if (!liveResponse.ok) throw new Error('চ্যানেল তালিকা পাওয়া যায়নি');
      const streams = await liveResponse.json();
      if (!Array.isArray(streams)) throw new Error('সার্ভার থেকে সঠিক চ্যানেল তালিকা আসেনি');
      const items = streams.map(s => ({
        name: s.name || ('Channel ' + s.stream_id),
        url: server + '/live/' + encodeURIComponent(username) + '/' + encodeURIComponent(password) + '/' + encodeURIComponent(s.stream_id) + '.' + (s.container_extension || 'm3u8')
      }));
      renderItems(items);
    } catch (e) {
      message('সংযোগ ব্যর্থ। Server URL, Username, Password, API ও CORS পরীক্ষা করুন। (' + e.message + ')');
    }
  })();
})();
</script>
</body>
</html>
