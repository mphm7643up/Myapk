
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parvez Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#090d18;--panel:#121a2b;--blue:#4f8cff;--purple:#a855f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:linear-gradient(120deg,#172554,#581c87);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-size:23px;font-weight:bold}
.logo span{color:#60a5fa}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:#26344e;color:white}
button.active,button:hover{background:var(--blue)}
input{background:#111a2a;color:white;border:1px solid #34415b;border-radius:9px;padding:12px;width:100%}
main{max-width:1250px;margin:auto;padding:15px}
.playerbox{background:#111827;border:1px solid #27344b;border-radius:15px;overflow:hidden}
video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.now{padding:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.note{color:#aab8d0;font-size:13px;padding:0 13px 13px}
.tools{display:grid;grid-template-columns:1fr auto;gap:9px;margin:16px 0}
.categories{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}
.categories button{white-space:nowrap}
.heading{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}
.channel{background:var(--panel);border:1px solid #25334b;border-radius:12px;padding:13px 9px;text-align:center;min-width:0}
.channel:active{border-color:var(--blue)}
.channel.selected{border-color:#60a5fa;background:#192b48}
.channel img{width:55px;height:55px;object-fit:contain;margin-bottom:9px}
.channel .name{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.channel .group{font-size:11px;color:#9aabc5;margin-top:6px}
.heart{color:#fb7185}
footer{text-align:center;color:#8392aa;padding:25px;font-size:12px}
@media(max-width:500px){
 header{padding:14px}.logo{font-size:20px}
 main{padding:10px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
 .channel{padding:10px 5px}.channel img{width:40px;height:40px}
 .channel .name{font-size:12px}.tools{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="logo">📺 Parvez <span>Live TV</span></div>
  <button id="refresh">🔄 Update Playlist</button>
</header>

<main>
  <section class="playerbox">
    <video id="video" controls playsinline></video>
    <div class="now">
      <strong id="playing">একটি চ্যানেল নির্বাচন করুন</strong>
      <div class="controls">
        <button id="prev">⏮ Previous</button>
        <button id="next">Next ⏭</button>
      </div>
    </div>
    <div class="note" id="status">লাইভ টিভি দেখতে নিচের তালিকা থেকে চ্যানেল নির্বাচন করুন।</div>
  </section>

  <div class="tools">
    <input id="search" placeholder="🔍 চ্যানেল খুঁজুন...">
    <button id="all">🌐 All Channels</button>
  </div>

  <div class="categories" id="categories">
    <button class="active" data-cat="All">🌐 All</button>
    <button data-cat="Favs">❤️ Favs</button>
    <button data-cat="Pinned">📌 Pinned</button>
    <button data-cat="Sports">🏏 Sports</button>
    <button data-cat="News">📰 News</button>
    <button data-cat="Bangla">🇧🇩 Bangla</button>
    <button data-cat="Indian Bangla">🇮🇳 Indian Bangla</button>
    <button data-cat="Movies">🍿 Movies</button>
    <button data-cat="Kids">🧸 Kids</button>
    <button data-cat="Entertainment">🎭 Entertainment</button>
    <button data-cat="Other">📂 Other</button>
  </div>

  <div class="heading">
    <strong id="listTitle">Channel List</strong>
    <span id="count">0 channels</span>
  </div>
  <div class="grid" id="channels"></div>
</main>

<footer>Parvez Live TV · Personal playlist player</footer>

<script>
const PLAYLIST_URL =
'https://raw.githubusercontent.com/mphm7643up/Tv2/refs/heads/main/playlist.m3u';

const $ = id => document.getElementById(id);
let channels = [], current = -1, category = 'All', hls = null;

let favs = JSON.parse(localStorage.getItem('ptv_favs') || '[]');
let pinned = JSON.parse(localStorage.getItem('ptv_pinned') || '[]');

function save(){
  localStorage.setItem('ptv_favs', JSON.stringify(favs));
  localStorage.setItem('ptv_pinned', JSON.stringify(pinned));
}

function attr(line, name){
  const match = line.match(new RegExp(name+'="([^"]*)"','i'));
  return match ? match[1] : '';
}

function parseM3U(text){
  const result = [];
  let info = '';
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if(line.startsWith('#EXTINF')){
      info = line;
    }else if(line && !line.startsWith('#') && info){
      const comma = info.indexOf(',');
      const name = comma >= 0 ? info.slice(comma+1).trim() : 'Unknown';
      result.push({
        name,
        url: line,
        logo: attr(info,'tvg-logo'),
        group: attr(info,'group-title') || 'Other'
      });
      info = '';
    }
  }
  return result;
}

function classify(c){
  const s = (c.group+' '+c.name).toLowerCase();
  if(/sport|cricket|football/.test(s)) return 'Sports';
  if(/news/.test(s)) return 'News';
  if(/kids|cartoon|baby/.test(s)) return 'Kids';
  if(/movie|cinema|film/.test(s)) return 'Movies';
  if(/indian bangla|star jalsha|zee bangla|colors bangla|sun bangla|aakash aath|sony aath/.test(s)) return 'Indian Bangla';
  if(/bangla|bangladesh|jamuna|somoy|ntv|rtv|channel i|ekattor|maasranga/.test(s)) return 'Bangla';
  if(/entertainment|music|drama/.test(s)) return 'Entertainment';
  return 'Other';
}

async function loadPlaylist(){
  $('refresh').disabled = true;
  $('status').textContent = 'প্লেলিস্ট আপডেট হচ্ছে...';
  try{
    const response = await fetch(PLAYLIST_URL + '?t=' + Date.now(), {
      cache:'no-store'
    });
    if(!response.ok) throw new Error('HTTP '+response.status);
    const text = await response.text();
    const parsed = parseM3U(text);
    if(!parsed.length) throw new Error('কোনো চ্যানেল পাওয়া যায়নি');
    channels = parsed;
    render();
    $('status').textContent = 'প্লেলিস্ট আপডেট হয়েছে। মোট '+channels.length+'টি চ্যানেল।';
  }catch(e){
    $('status').textContent = 'প্লেলিস্ট লোড হয়নি। Raw URL ও ইন্টারনেট পরীক্ষা করুন।';
  }finally{
    $('refresh').disabled = false;
  }
}

function render(){
  const q = $('search').value.toLowerCase().trim();
  const list = channels.map((c,i)=>({...c,i}));
  const shown = list.filter(c=>{
    const cat = classify(c);
    const matchCat =
      category === 'All' ||
      (category === 'Favs' && favs.includes(c.url)) ||
      (category === 'Pinned' && pinned.includes(c.url)) ||
      category === cat ||
      (category === c.group);
    return matchCat &&
      (c.name+' '+c.group).toLowerCase().includes(q);
  });

  $('channels').innerHTML = '';
  $('count').textContent = shown.length+' channels';
  $('listTitle').textContent = category === 'All' ? 'Channel List' : category;

  shown.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'channel'+(current===c.i?' selected':'');
    const img = document.createElement('img');
    img.alt = '';
    img.src = c.logo || '';
    img.onerror = () => { img.style.visibility='hidden'; };
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = c.name;
    const group = document.createElement('div');
    group.className = 'group';
    group.textContent = c.group;
    const actions = document.createElement('div');
    actions.style.marginTop = '10px';

    const heart = document.createElement('button');
    heart.className = 'heart';
    heart.textContent = favs.includes(c.url) ? '♥' : '♡';
    heart.title = 'Favourite';
    heart.onclick = e=>{
      e.stopPropagation();
      favs = favs.includes(c.url)
        ? favs.filter(x=>x!==c.url) : [...favs,c.url];
      save(); render();
    };

    const pin = document.createElement('button');
    pin.textContent = pinned.includes(c.url) ? '📌' : '＋';
    pin.title = 'Pin channel';
    pin.style.marginLeft = '5px';
    pin.onclick = e=>{
      e.stopPropagation();
      pinned = pinned.includes(c.url)
        ? pinned.filter(x=>x!==c.url) : [...pinned,c.url];
      save(); render();
    };

    actions.append(heart,pin);
    card.append(img,name,group,actions);
    card.onclick = ()=>play(c.i);
    $('channels').append(card);
  });
}

function play(index){
  if(index<0 || index>=channels.length) return;
  current = index;
  const c = channels[index];
  const video = $('video');
  if(hls){hls.destroy();hls=null;}
  video.pause();
  video.removeAttribute('src');
  video.load();
  $('playing').textContent = c.name;
  $('status').textContent = 'চ্যানেল লোড হচ্ছে...';

  if(c.url.includes('.m3u8') && Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(c.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      video.play().catch(()=>{});
      $('status').textContent = 'লাইভ স্ট্রিম প্রস্তুত';
    });
    hls.on(Hls.Events.ERROR,(event,data)=>{
      if(data.fatal) $('status').textContent =
        'স্ট্রিম চালানো যাচ্ছে না। লিংকটি পরীক্ষা করুন।';
    });
  }else{
    video.src = c.url;
    video.play().then(()=>{
      $('status').textContent='চ্যানেল চলছে';
    }).catch(()=>{
      $('status').textContent =
        'এই ফরম্যাট ব্রাউজারে নাও চলতে পারে বা স্ট্রিম অনুপলব্ধ।';
    });
  }
  render();
}

$('refresh').onclick = loadPlaylist;
$('all').onclick = ()=>{
  category='All'; setActive(); render(); loadPlaylist();
};
$('search').oninput = render;
$('prev').onclick = ()=>{if(current>0) play(current-1);};
$('next').onclick = ()=>{if(current<channels.length-1) play(current+1);};

function setActive(){
  document.querySelectorAll('[data-cat]').forEach(b=>{
    b.classList.toggle('active',b.dataset.cat===category);
  });
}
document.querySelectorAll('[data-cat]').forEach(b=>{
  b.onclick=()=>{category=b.dataset.cat;setActive();render();};
});

loadPlaylist();
</script>
</body>
</html>
